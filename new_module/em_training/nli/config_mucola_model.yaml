energynet:
  base_model: roberta-large
  output_form: 2dim_vec
  energy_col: 1
  label_column: binary_labels
  batch_size: 
    binary: 32
    continuous: 32
  num_epochs: 3
  optimizer: adamw
  max_lr: 1e-5
  weight_decay: 0.03
  loss: binary_cross_entropy
  margin: n/a
  additional_loss:
    use: false
    loss: n/a
    margin: n/a
    setting: n/a
    mixing_weights: n/a
  fill_missing_finegrained: true
  add_train_data: true
  eval_every: 100
  early_stopping: 
    use: false
    min_delta: 0.0
    patience: 5
  binary_loader: balanced
  ckpt_save_path: /data/hyeryung/loc_edit/models/nli
  dataset_path: data/nli/snli_mnli_anli_train_dev_with_finegrained.jsonl
  mucola_style: true

locate:
  type: gradnorm

device: cuda