energynet:
  base_model: roberta-large
  output_form: 2dim_vec
  energy_col: 1
  label_column: finegrained_labels
  batch_size: 
    binary: 32
    continuous: 32
  num_epochs: 78
  optimizer: adamw
  max_lr: 1e-5
  weight_decay: 0.03
  loss: cross_entropy
  margin: n/a
  additional_loss:
    use: false
    loss: n/a
    margin: n/a
    setting: n/a
    mixing_weights: n/a
  fill_missing_finegrained: false
  add_train_data: false
  eval_every: 100
  early_stopping: 
    use: false
    min_delta: 0.0
    patience: 5
  binary_loader: balanced
  ckpt_save_path: /home/hyeryung/data/loc_edit/models/nli
  dataset_path: laser_edit/ebm_training/data/nli/snli_mnli_anli_train_dev_with_finegrained.jsonl

locate:
  type: gradnorm

device: cuda